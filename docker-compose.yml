services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: documind

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - mongodb
      - redis
      - minio
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info

  notification-service:
    build: ./notification-service
    ports:
      - "3001:3001"
    env_file: ./notification-service/.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    command: node src/index.js

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file: ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  admin-panel:
    build: ./admin-panel
    ports:
      - "4200:4200"
    depends_on:
      - backend
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    command: npx ng serve --host 0.0.0.0 --port 4200

volumes:
  mongo_data:
  minio_data:
